name: CI Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-build-check:
    name: Windows build and check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsgo --noEmit

      - name: Check the Windows installer
        # Structural checks plus a real pwsh parse. check:installer is not used
        # here: it drives install.sh through a POSIX `sh` harness.
        run: npm run check:installer-ps1

      - name: Report lint differences (informational)
        continue-on-error: true
        run: npx biome check .

  windows-tests:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run the Windows-compatible test files
        working-directory: packages/coding-agent
        run: >
          npx vitest --run
          test/kernel-bootstrap-windows.test.ts
          test/kernel-windows-process.test.ts
          test/kernel-bash-shell.test.ts
          test/tools.test.ts
          test/tools-manager.test.ts
          test/bash-destructive-git-guard.test.ts
          test/bash-execution-width.test.ts
          test/bash-close-hang-windows.test.ts
          test/async-bash-completion.test.ts
          test/edit-tool-legacy-input.test.ts
          test/edit-tool-no-full-redraw.test.ts
          test/exec.test.ts
          test/shell-env.test.ts
          test/child-process.test.ts
          test/daemon-socket.test.ts
          test/daemon-ps.test.ts
          test/daemon-ps-format.test.ts
          test/daemon-ps-windows-discovery.test.ts
          test/secure-dir.test.ts
          test/suite/agent-session-bash-persistence.test.ts

  kernel-runtime-tests:
    name: Windows kernel runtime tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the kernel runtime suite on Windows
        working-directory: prime-agent-runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . dill
          python -m unittest test.test_winjob
          python -m unittest test.test_bash_windows
          python -m unittest test.test_bash
