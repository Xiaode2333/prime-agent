name: CI Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Check the Windows installer parses
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install.ps1'), [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "install.ps1 has parse errors"
          }

      - name: Run Windows-specific tests
        working-directory: packages/coding-agent
        run: >
          npx vitest --run
          test/kernel-bootstrap-windows.test.ts
          test/kernel-windows-process.test.ts
          test/kernel-bash-shell.test.ts
          test/suite/agent-session-bash-persistence.test.ts

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run kernel runtime tests on Windows
        working-directory: prime-agent-runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install mcp tyro dill
          python -m unittest discover -s test -t test -p "test_winjob.py"
