name: CI Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-build-check:
    name: Windows build and check
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npx tsgo --noEmit

      - name: Check the Windows installer
        # Structural checks plus a real Windows PowerShell parse. check:installer is
        # not used here: it drives install.sh through a POSIX `sh` harness.
        run: npm run check:installer-ps1

      - name: Report lint differences (informational)
        continue-on-error: true
        run: npx biome check .

  windows-tests:
    name: Windows tests
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the full suite
        # Same command as Linux `test:ci`: it prepares the Python kernel, then runs
        # every test file except the process test, which upstream runs separately.
        # Files whose fixtures are POSIX-only skip themselves on Windows.
        working-directory: packages/coding-agent
        env:
          DO_NOT_TRACK: "1"
        run: npm run test:ci

  kernel-runtime-tests:
    name: Windows kernel runtime tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run the kernel runtime suite on Windows
        working-directory: prime-agent-runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . dill
          python -m unittest test.test_winjob
          python -m unittest test.test_bash_windows
          python -m unittest test.test_bash
